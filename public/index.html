<style>

.rg,.wp,.cs{position:absolute;width:0;height:0;transform-origin:0 0}.wp{left:0;top:0}.cs{left:0;top:0;animation:uspin linear infinite}.rg{animation:spin linear infinite}.w2{position:absolute;left:0;top:0;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;line-height:1}.fade{animation:fade 1s both}@keyframes fade{from{opacity:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes uspin{to{transform:rotate(-360deg)}}

</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script></head><body>

<script>
// Runtime layer: talks to this server over HTTP + a live event stream (deltas, no polling storms).
(function(){
const hostPath=location.pathname.replace(/\/+$/,'')==='/host';
let token=localStorage.getItem('ants_token')||'',uid=localStorage.getItem('ants_uid');
if(!uid){uid='u'+Math.random().toString(36).slice(2,12);localStorage.setItem('ants_uid',uid)}
const call=async(m,p,b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'content-type':'application/json','x-token':token},body:b===undefined?undefined:JSON.stringify(b)});const j=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status===401||r.status===403?'not_granted':'unavailable',message:j.error||('HTTP '+r.status)};return j};
const ready=(async()=>{if(!hostPath)return;if(token){try{await call('GET','whoami')}catch(e){token='';localStorage.removeItem('ants_token')}}
 for(let i=0;i<3&&!token;i++){const p=prompt('Host password for A.N.T.S ModTecH');if(p===null)return;try{token=(await call('POST','login',{password:p})).token;localStorage.setItem('ants_token',token)}catch(e){alert('Wrong password')}}})();
const cache={deck:undefined,resp:null};let live=false,es=null,fT=0,dD=0,dR=0;const sD=new Set(),sR=new Set();
const fire=()=>{if(fT)return;fT=setTimeout(()=>{fT=0;if(dD){dD=0;sD.forEach(f=>f())}if(dR){dR=0;sR.forEach(f=>f())}},120)};
const full=async()=>{const [d,r]=await Promise.all([call('GET','deck'),call('GET','responses')]);cache.deck=d.deck;cache.resp=new Map(r.items.map(x=>[x.id,x.data]));dD=dR=1;fire()};
const connect=()=>{if(es)return;es=new EventSource('/api/stream');
 es.onopen=()=>{live=true;full().catch(()=>{})};es.onerror=()=>{live=false};
 es.onmessage=ev=>{let a;try{a=JSON.parse(ev.data)}catch(e){return}if(!cache.resp)return;
  for(const m of a){if(m.t==='r'){cache.resp.set(m.id,m.d);dR=1}else if(m.t==='del'){cache.resp.delete(m.id);dR=1}else if(m.t==='clear'){cache.resp.clear();dR=1}else if(m.t==='deck'){cache.deck=m.d;dD=1}}fire()}};
const ensure=async()=>{if(cache.resp&&live)return;await full();connect()};
const dsnap=()=>({id:'main',exists:!!cache.deck,data:()=>cache.deck||undefined,metadata:{}});
const qsnap=()=>{const a=[...cache.resp];return{docs:a.map(([id,data])=>({id,exists:true,data:()=>data})),size:a.length,empty:!a.length,metadata:{}}};
const sub=(set,snap,next,err)=>{const f=()=>{try{next(snap())}catch(e){}};set.add(f);ensure().then(f).catch(e=>err&&err(e));connect();return()=>set.delete(f)};
const deckRef={id:'main',path:'deck/main',get:async()=>{await ensure();return dsnap()},set:d=>call('PUT','deck',d).then(()=>{}),update:d=>deckRef.set(d),onSnapshot:(n,e)=>sub(sD,dsnap,n,e)};
const respRef=id=>({id,path:'responses/'+id,set:d=>call('PUT','responses/'+encodeURIComponent(id),d).then(()=>{}),delete:()=>call('DELETE','responses/'+encodeURIComponent(id)).then(()=>{})});
const rcol={path:'responses',get:async()=>{await ensure();return qsnap()},onSnapshot:(n,e)=>sub(sR,qsnap,n,e),add:async d=>{const j=await call('POST','responses',d);return respRef(j.id)},doc:id=>respRef(id),clear:()=>call('DELETE','responses').then(()=>{})};
const db={doc:p=>p==='deck/main'?deckRef:respRef(p.split('/')[1]),collection:()=>rcol};
const isH=()=>!!token&&hostPath;
const user={isOwner:async()=>isH(),canEdit:async()=>isH(),can:async()=>null,id:async()=>uid,me:async()=>({id:uid,name:'',isOwner:isH(),canEdit:isH()})};
const dl={save:async({filename,data})=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/csv'}));a.download=filename;a.click()}};
window.claude={use:async n=>{await ready;return n==='db'?db:n==='user'?user:n==='downloads'?dl:null}};
})();
</script>
<script>
const TYPES={wordcloud:'Word cloud',poll:'Multiple choice',quiz:'Quiz',scale:'Scale (1–5)',open:'Open text',rank:'Ranking',qa:'Q&amp;A (upvotes)'};
const COLORS=['#5b3df5','#ff5fa2','#0ea5e9','#f59e0b','#10b981','#ef4444','#8b5cf6'];
const uid=()=>Math.random().toString(36).slice(2,9);
const mk=(type,q)=>({id:uid(),type,q,opts:['poll','quiz','rank'].includes(type)?['Option A','Option B','Option C']:[],ans:0,max:3});
let deck={title:'My Live Session',cur:0,live:true,slides:[mk('wordcloud','One word that describes today’s topic'),mk('poll','Which topic should we cover next?'),mk('scale','How confident do you feel? (1–5)'),mk('open','Any questions for me?')]};
let resp=[],db=null,dref=null,rcol=null,me='anon'+uid(),isHost=true,mode='edit',pres=false,mine={},rk={},aidx=0,noDb=false,netErr='',panel=false,local=!1;const JOIN=location.origin+'/';
const root=document.getElementById('root');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cur=()=>deck.slides[Math.max(0,Math.min((!isHost&&!deck.follow)?aidx:deck.cur,deck.slides.length-1))];
const rs=s=>resp.filter(r=>r.s===s.id&&!r.up);
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{if(dref&&isHost)dref.set(deck).catch(()=>{})},350)}
function upd(fn){fn();save();render()}

async function init(){
 if(location.hash==='#join')isHost=false;
 try{const u=await claude.use('user');if(u){try{const i=await u.id();if(i)me=i}catch(e){}
  if(isHost&&!(await u.canEdit()))isHost=false}}catch(e){}
 try{db=await claude.use('db')}catch(e){}
 if(!db){if(!isHost){noDb=true;render();return}local=true;render();return}
 dref=db.doc('deck/main');rcol=db.collection('responses');
 let first=true;
 dref.onSnapshot(s=>{const was=first;if(s.exists){if(!(isHost&&!first))deck=s.data();first=false}else if(isHost&&first){dref.set(deck).catch(()=>{});first=false}if(was||!isHost){const a=document.getElementById('av'),k=a&&a.value;render();const n=document.getElementById('av');if(k&&n)n.value=k}else paint()});
 rcol.onSnapshot(q=>{netErr='';resp=q.docs.map(d=>d.data());paint()},e=>{netErr=(e&&e.message)||'connection error';paint()});
 setInterval(async()=>{try{const q=await rcol.get();netErr='';resp=q.docs.map(d=>d.data());paint();if(!isHost){const d=await dref.get();if(d.exists&&JSON.stringify(d.data())!==JSON.stringify(deck)){deck=d.data();const a=document.getElementById('av'),k=a&&a.value;render();const n=document.getElementById('av');if(k&&n)n.value=k}}}catch(e){}},20000);
 render()
}
async function submit(s,v){
 const r={s:s.id,v,u:me,t:Date.now(),id:uid()};
 if(local){resp.push(r);return paint()}
 try{if(s.type==='wordcloud'||s.type==='open'||s.type==='qa')await rcol.add(r);else await rcol.doc(s.id+'_'+me).set(r)}catch(e){alert(e&&e.code==='not_granted'?'The host has not allowed responses yet. Ask the host to let people interact with this page.':'Could not send: '+(e.message||e))}
}
const THEMES={Auto:null,Violet:{'--bg':'#f6f4ff','--card':'#fff','--ink':'#1b1740','--mut':'#6b6890','--line':'#e4e0f7','--pri':'#5b3df5','--pri2':'#ff5fa2'},Ocean:{'--bg':'#eef8ff','--card':'#fff','--ink':'#0b2a40','--mut':'#4f7189','--line':'#d3e8f5','--pri':'#0284c7','--pri2':'#14b8a6'},Sunset:{'--bg':'#fff5ee','--card':'#fff','--ink':'#3b1a0b','--mut':'#8a6450','--line':'#f6dccb','--pri':'#ea580c','--pri2':'#db2777'},Forest:{'--bg':'#f0f8f2','--card':'#fff','--ink':'#12301f','--mut':'#527360','--line':'#d2eadb','--pri':'#15803d','--pri2':'#ca8a04'},Midnight:{'--bg':'#0d0b1f','--card':'#17143a','--ink':'#f0eeff','--mut':'#9d9acb','--line':'#2a2658','--pri':'#8b5cf6','--pri2':'#f472b6'}};
function accent(){const st=document.documentElement.style,t=THEMES[deck.theme||'Auto'];Object.keys(THEMES.Violet).forEach(k=>st.removeProperty(k));if(t)Object.entries(t).forEach(([k,v])=>st.setProperty(k,v));if(deck.accent)st.setProperty('--pri',deck.accent)}
const brand=()=>deck.logo&&/^data:image\//.test(deck.logo)?`<img src="${deck.logo}" alt="logo" style="height:34px;display:block">`:`<div><span class="logo" style="display:block">A.N.T.S ModTecH</span><small class="mut">Alumni Networking Team · SDMIMD</small></div>`;
function qrSvg(u){try{const q=qrcode(0,'M');q.addData(u);q.make();return q.createSvgTag(5,2)}catch(e){return'<span class="mut">QR unavailable</span>'}}
function panelHtml(){const u=deck.joinUrl||JOIN;return`<div class="modal" id="md"><div class="card mc"><div class="row"><h2 style="flex:1">Share &amp; Brand</h2><button class="btn" id="mx2">Close</button></div><label>Audience join link</label><input type="text" id="ju" value="${esc(u)}"><div class="qrw" style="background:#fff;width:190px;padding:8px;border-radius:12px;margin-top:10px">${qrSvg(u)}</div><label>Audience navigation</label><select id="fr"><option value="f" ${!deck.follow?'selected':''}>Free: audience can browse all questions</option><option value="p" ${deck.follow?'selected':''}>Follow presenter: one question at a time</option></select><label>Theme</label><select id="th">${Object.keys(THEMES).map(k=>`<option ${k===(deck.theme||'Auto')?'selected':''}>${k}</option>`).join('')}</select><label>Accent color</label><input type="color" id="ac" value="${deck.accent||'#22d3ee'}"><label>Logo (shown on host, presenter and audience screens)</label><div class="row"><input type="file" id="lg" accept="image/*"><button class="btn d" id="lr">Remove</button></div></div></div>`}
function bindPanel(){const g=id=>document.getElementById(id);g('mx2').onclick=()=>{panel=false;render()};g('md').onclick=e=>{if(e.target.id==='md'){panel=false;render()}};
 g('ju').onchange=e=>upd(()=>deck.joinUrl=e.target.value.trim());g('th').onchange=e=>upd(()=>deck.theme=e.target.value);g('fr').onchange=e=>upd(()=>deck.follow=e.target.value==='p');
 g('ac').oninput=e=>{deck.accent=e.target.value;accent();save()};g('lr').onclick=()=>upd(()=>delete deck.logo);
 g('lg').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,240/im.width,64/im.height);c.width=Math.max(1,im.width*k);c.height=Math.max(1,im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);upd(()=>deck.logo=c.toDataURL('image/png'))};im.src=URL.createObjectURL(f)}}
async function vote(s,qid){const r={s:s.id,up:qid,u:me,t:Date.now()};if(local){if(!resp.some(x=>x.up===qid&&x.u===me))resp.push(r);return paint()}try{await rcol.doc(s.id+'_up_'+qid+'_'+me).set(r)}catch(e){}}
function qaList(el,s,aud){const qs=rs(s).map(q=>({...q,n:resp.filter(x=>x.up===q.id).length,m:resp.some(x=>x.up===q.id&&x.u===me)})).sort((a,b)=>b.n-a.n||b.t-a.t);
 el.innerHTML=qs.map(q=>`<div class="opt" style="cursor:default"><div class="row"><span style="flex:1">${esc(q.v)}</span>${aud?`<button class="btn ${q.m?'p':''}" data-up="${esc(q.id)}">▲ ${q.n}</button>`:`<b>▲ ${q.n}</b>`}</div></div>`).join('')||'<span class="mut">No questions yet</span>';
 el.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>vote(s,b.dataset.up))}
function render(){
 accent();
 if(!isHost){root.innerHTML=audience();bindAud();return}
 if(pres){root.innerHTML=presView();bindPres();paint();return}
 const s=cur();
 root.innerHTML=`<div class="top">${brand()}
 <input type="text" id="dt" value="${esc(deck.title)}" style="width:220px">
 <span class="pill ${deck.live?'on':'off'}">${deck.live?'● Live: accepting responses':'■ Responses closed'}</span><span class="pill" id="net"></span><span class="sp"></span><button class="btn" id="ts">Test response</button><button class="btn" id="sb">Share &amp; Brand</button>
 <button class="btn" id="lv">${deck.live?'Pause responses':'Go live'}</button>
 <button class="btn" id="cl">Clear responses</button><button class="btn" id="ex">Export CSV</button>
 <button class="btn p" id="pr">▶ Present</button></div>
 <div class="app"><div class="col">${deck.slides.map((x,i)=>`<div class="sl ${i===deck.cur?'a':''}" data-i="${i}"><b>${i+1}. ${esc(x.q).slice(0,40)}</b><small>${TYPES[x.type]} · ${rs(x).length} responses</small></div>`).join('')}
  <select id="nt"><option value="">+ Add slide…</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>
 <div class="stage"><div class="card"><h2>${esc(s.q)}</h2><div class="mut">Join by opening this page’s link and adding <b>#join</b> at the end.</div><div id="res" style="margin-top:14px"></div></div></div>

function step(e,dt){

function phys(e,dt){
 const L=e.lay,ws=e.order,n=ws.length,W=e.W,H=e.H,cx=W/2,cy=H/2,m=e.m,t=e.t,net=L==='network',fx=new Float32Array(n),fy=new Float32Array(n);

  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=ws[i],b=ws[j],dx=b.x-a.x,dy=b.y-a.y;
   if(net){const ox=(a.bw+b.bw)/2+6-Math.abs(dx),oy=(a.bh+b.bh)/2+4-Math.abs(dy);if(ox>0&&oy>0){if(ox<oy){const p=(ox/2+.5)*(dx<0?-1:1);a.x-=p;b.x+=p}else{const p=(oy/2+.5)*(dy<0?-1:1);a.y-=p;b.y+=p}}}

const eob=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function draw(e,c,now){

  if(L==='orbit'){const th=w.th,bottom=Math.sin(th)>0,sg=bottom?-1:1,k=w.s/w.fs*pop;c.globalAlpha=al*Math.min(1,Math.abs(Math.sin(th))/.25);c.font=F(e,w.fs*k);c.shadowBlur=4+14*f;
   let off=0;for(let j=0;j<w.t.length;j++){const cw=w.cws[j]*k,ang=th+sg*((off+cw/2)-w.tw*k/2)/w.rho;off+=cw;

  else if(L==='bubbles'){const r=w.br*pop*(1+.25*f),g=c.createRadialGradient(w.x-r*.3,w.y-r*.3,r*.1,w.x,w.y,r);g.addColorStop(0,col+'88');g.addColorStop(1,col+'22');
   c.shadowBlur=10+16*f;c.fillStyle=g;c.beginPath();c.arc(w.x,w.y,r,0,6.2832);c.fill();c.shadowBlur=0;c.strokeStyle=col;c.lineWidth=1.5;c.stroke();
   c.fillStyle='#fff';c.font=F(e,w.s*pop*(1+.25*f));c.fillText(w.t,w.x,w.y)}
  else{const sz=Math.max(1,w.s*pop*(1+.5*f));c.font=F(e,sz);c.shadowBlur=sz>26?12+16*f:5+14*f;c.fillText(w.t,w.x,w.y)}
  c.shadowBlur=0}
 c.globalAlpha=1;
 if(e.total>100){c.fillStyle='rgba(138,160,200,.8)';c.font='600 11px "Orbitron",sans-serif';c.textAlign='right';c.fillText('+'+(e.total-100)+' MORE WORDS',W-10,H-10)}}
